<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PC Bang Control</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0f;--surface:#13131a;--border:#1e1e2e;--accent:#3b82f6;--danger:#ef4444;--danger-dim:rgba(239,68,68,.15);--green:#22c55e;--yellow:#f59e0b;--text:#e2e8f0;--muted:#64748b}
body{background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;min-height:100dvh}
.header{padding:20px 20px 0;display:flex;justify-content:space-between;align-items:center}
.header-left .title{font-size:22px;font-weight:700}
.header-left .sub{font-size:12px;color:var(--muted);margin-top:2px}
.header-btns{display:flex;gap:8px}
.hdr-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:10px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.spinning{animation:spin .6s linear}
@keyframes spin{to{transform:rotate(360deg)}}
.status-bar{margin:16px 20px 0;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.status-count{display:flex;gap:20px}
.count-item{text-align:center}
.count-num{font-size:24px;font-weight:700;line-height:1}
.count-num.green{color:var(--green)}
.count-num.muted{color:var(--muted)}
.count-label{font-size:11px;color:var(--muted);margin-top:3px}
.last-update{font-size:11px;color:var(--muted);text-align:right;line-height:1.6}
.action-btns{padding:14px 20px 0;display:flex;gap:8px;flex-wrap:wrap}
.action-btn{flex:1 0 calc(50% - 4px);border-radius:14px;padding:13px 8px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid}
.action-btn:disabled{opacity:.4;cursor:default}
.btn-shutdown{background:var(--danger-dim);border-color:var(--danger);color:var(--danger)}
.btn-msg{background:rgba(245,158,11,.15);border-color:var(--yellow);color:var(--yellow)}
.btn-cmd{background:rgba(59,130,246,.15);border-color:var(--accent);color:var(--accent)}
.section-label{padding:18px 20px 10px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.pc-list{padding:0 20px 30px;display:flex;flex-direction:column;gap:8px}
.pc-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pc-card.online{border-color:rgba(34,197,94,.3)}
.pc-info{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.pc-dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex-shrink:0}
.pc-dot.online{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.pc-name{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-status{font-size:11px;color:var(--muted);margin-top:2px}
.pc-status.online{color:var(--green)}
.pc-actions{display:flex;gap:5px;flex-wrap:wrap}
.ic-btn{border-radius:10px;padding:8px 10px;font-size:15px;cursor:pointer;border:1px solid;background:transparent;color:var(--text)}
.ic-sd{border-color:rgba(239,68,68,.4);color:var(--danger)}
.ic-msg{border-color:rgba(245,158,11,.4);color:var(--yellow)}
.ic-cmd{border-color:rgba(59,130,246,.4);color:var(--accent)}
.ic-del{border-color:rgba(100,116,139,.3);color:var(--muted)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:10px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;padding:0 16px 32px;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.show{opacity:1;pointer-events:all}
.modal{background:#1a1a28;border:1px solid var(--border);border-radius:20px;padding:24px 20px 20px;width:100%;max-width:400px;transform:translateY(20px);transition:transform .2s}
.modal-overlay.show .modal{transform:translateY(0)}
.modal-title{font-size:18px;font-weight:700;margin-bottom:8px}
.modal-desc{font-size:14px;color:var(--muted);margin-bottom:16px;line-height:1.5}
.modal-textarea{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:12px 14px;font-size:14px;outline:none;resize:none;height:100px;font-family:inherit;margin-bottom:16px}
.modal-input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:12px 14px;font-size:14px;outline:none;font-family:monospace;margin-bottom:16px}
.modal-btns{display:flex;gap:10px}
.modal-cancel{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer}
.modal-confirm{flex:1;border:none;color:white;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer}
.modal-confirm.danger{background:var(--danger)}
.modal-confirm.yellow{background:var(--yellow);color:#000}
.modal-confirm.blue{background:var(--accent)}
.modal-confirm.gray{background:#475569}
.modal-confirm.red2{background:#7f1d1d}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-20px);background:#1e1e2e;border:1px solid var(--border);border-radius:20px;padding:10px 18px;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .2s,transform .2s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.setup{padding:40px 24px;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}
.setup-title{font-size:26px;font-weight:700;margin-bottom:8px}
.setup-sub{font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.6}
.setup-label{font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:500}
.setup-input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:14px 16px;font-size:14px;outline:none;margin-bottom:16px}
.setup-btn{width:100%;background:var(--accent);border:none;color:white;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px}
.setup-divider{border:none;border-top:1px solid var(--border);margin:4px 0 16px}
.setup-hint{font-size:12px;color:var(--muted);margin-top:-10px;margin-bottom:16px;padding:0 2px}
</style>
</head>
<body>

<div class="setup" id="setupScreen" style="display:none">
  <div class="setup-title">⚙️ Тохиргоо</div>
  <div class="setup-sub">Нэг удаа тохируулбал хадгалагдана.</div>
  <div class="setup-label">🏪 PC Bang нэр</div>
  <input class="setup-input" type="text" id="bangNameInput" placeholder="Insane PC Bang">
  <div class="setup-hint">Мессежийн popup дээр харагдана</div>
  <hr class="setup-divider">
  <div class="setup-label">Firebase Realtime Database URL</div>
  <input class="setup-input" type="url" id="urlInput" placeholder="https://your-project-default-rtdb.region.firebasedatabase.app">
  <hr class="setup-divider">
  <div class="setup-label">🔑 Нууц түлхүүр</div>
  <input class="setup-input" type="password" id="keyInput" placeholder="Нууц түлхүүр">
  <button class="setup-btn" onclick="saveSetup()">Холбогдох →</button>
</div>

<div id="mainScreen" style="display:none">
  <div class="header">
    <div class="header-left">
      <div class="title" id="bangTitle">PC Bang</div>
      <div class="sub" id="headerSub">↻ дарж шинэчилнэ үү</div>
    </div>
    <div class="header-btns">
      <button class="hdr-btn" id="refreshBtn" onclick="loadPCs()">↻</button>
      <button class="hdr-btn" onclick="openSettings()">⚙️</button>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-count">
      <div class="count-item"><div class="count-num green" id="onlineCount">—</div><div class="count-label">ONLINE</div></div>
      <div class="count-item"><div class="count-num muted" id="totalCount">—</div><div class="count-label">НИЙТ</div></div>
    </div>
    <div class="last-update" id="lastUpdate">—</div>
  </div>

  <div class="action-btns">
    <button class="action-btn btn-shutdown" id="allBtn" onclick="confirmAll('shutdown')" disabled>⏻ Бүгд унтраах</button>
    <button class="action-btn btn-msg" id="allMsgBtn" onclick="confirmAll('message')" disabled>💬 Бүгдэд мессеж</button>
    <button class="action-btn btn-cmd" id="allCmdBtn" onclick="confirmAll('cmd')" disabled>⌨️ Бүгдэд CMD</button>
  </div>

  <div class="section-label">КОМПЬЮТЕРҮҮД</div>
  <div class="pc-list" id="pcList">
    <div class="empty"><div class="empty-icon">👆</div><div>↻ дарж PC жагсаалт харна уу</div></div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-desc" id="modalDesc"></div>
    <textarea class="modal-textarea" id="modalTextarea" style="display:none" placeholder="Мессеж..."></textarea>
    <input class="modal-input" id="modalCmdInput" style="display:none" placeholder="CMD команд">
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Болих</button>
      <button class="modal-confirm" id="modalConfirm" onclick="doConfirm()">Тийм</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ONLINE_TIMEOUT=15;
let FIREBASE_URL='',SECRET_KEY='',BANG_NAME='PC Bang',allPcData={},confirmAction=null;

function init(){
  const url=localStorage.getItem('pcbang_url');
  const key=localStorage.getItem('pcbang_key');
  const name=localStorage.getItem('pcbang_name');
  if(url&&key){
    FIREBASE_URL=url;SECRET_KEY=key;BANG_NAME=name||'PC Bang';
    document.getElementById('bangTitle').textContent=BANG_NAME;
    document.getElementById('mainScreen').style.display='';
    loadPCs();
  }else{
    document.getElementById('setupScreen').style.display='';
  }
}

function saveSetup(){
  const name=document.getElementById('bangNameInput').value.trim();
  const url=document.getElementById('urlInput').value.trim().replace(/\/$/,'');
  const key=document.getElementById('keyInput').value.trim();
  if(!name){showToast('⚠️ Нэр хоосон');return;}
  if(!url.startsWith('https://')){showToast('⚠️ URL буруу');return;}
  if(!key){showToast('⚠️ Түлхүүр хоосон');return;}
  localStorage.setItem('pcbang_name',name);
  localStorage.setItem('pcbang_url',url);
  localStorage.setItem('pcbang_key',key);
  FIREBASE_URL=url;SECRET_KEY=key;BANG_NAME=name;
  document.getElementById('bangTitle').textContent=BANG_NAME;
  document.getElementById('setupScreen').style.display='none';
  document.getElementById('mainScreen').style.display='';
  loadPCs();
}

function openSettings(){
  confirmAction={type:'settings'};
  document.getElementById('modalTitle').textContent='⚙️ Тохиргоо';
  document.getElementById('modalDesc').textContent='Тохиргоог устгаад дахин оруулах уу?';
  document.getElementById('modalTextarea').style.display='none';
  document.getElementById('modalCmdInput').style.display='none';
  const btn=document.getElementById('modalConfirm');
  btn.textContent='Дахин тохируулах';btn.className='modal-confirm red2';
  openModal();
}

function resetSettings(){
  ['pcbang_url','pcbang_key','pcbang_name'].forEach(k=>localStorage.removeItem(k));
  FIREBASE_URL='';SECRET_KEY='';BANG_NAME='PC Bang';allPcData={};
  document.getElementById('mainScreen').style.display='none';
  document.getElementById('setupScreen').style.display='';
}

function pcPath(n){return `pcs/${SECRET_KEY}/${n}`}
function pcsPath(){return `pcs/${SECRET_KEY}`}

async function fbGet(p){const r=await fetch(`${FIREBASE_URL}/${p}.json`);if(!r.ok)throw new Error();return r.json()}
async function fbPut(p,v){await fetch(`${FIREBASE_URL}/${p}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)})}
async function fbDelete(p){await fetch(`${FIREBASE_URL}/${p}.json`,{method:'DELETE'})}

async function loadPCs(){
  const btn=document.getElementById('refreshBtn');
  btn.classList.add('spinning');btn.disabled=true;
  try{
    const data=await fbGet(pcsPath());
    if(data&&typeof data==='object')Object.keys(data).forEach(n=>{allPcData[n]=data[n]});
    renderPCs();
    const t=new Date();
    document.getElementById('lastUpdate').textContent=`Шинэчлэгдсэн\n${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;
    document.getElementById('headerSub').textContent='Шинэчлэгдлээ ✓';
  }catch(e){
    showToast('⚠️ Firebase холбогдохгүй');
    document.getElementById('headerSub').textContent='Холбогдохгүй';
  }
  setTimeout(()=>{btn.classList.remove('spinning');btn.disabled=false},800);
}

function renderPCs(){
  const now=Math.floor(Date.now()/1000);
  const names=Object.keys(allPcData).filter(n=>allPcData[n]&&typeof allPcData[n]==='object').sort();
  let onlineCount=0,html='';
  names.forEach(name=>{
    const d=allPcData[name];
    const isOnline=(now-(d.last_seen||0))<ONLINE_TIMEOUT;
    if(isOnline)onlineCount++;
    const ago=isOnline?'Идэвхтэй':d.last_seen?timeAgo(now-d.last_seen)+' өмнө':'Мэдээлэл алга';
    html+=`<div class="pc-card ${isOnline?'online':''}">
      <div class="pc-info">
        <div class="pc-dot ${isOnline?'online':''}"></div>
        <div>
          <div class="pc-name">${name}</div>
          <div class="pc-status ${isOnline?'online':''}">${ago}</div>
        </div>
      </div>
      <div class="pc-actions">
        ${isOnline?`
          <button class="ic-btn ic-sd" onclick="confirmOne('shutdown','${name}')">⏻</button>
          <button class="ic-btn ic-msg" onclick="confirmOne('message','${name}')">💬</button>
          <button class="ic-btn ic-cmd" onclick="confirmOne('cmd','${name}')">⌨️</button>
        `:''}
        <button class="ic-btn ic-del" onclick="confirmOne('remove','${name}')">🗑️</button>
      </div>
    </div>`;
  });
  if(!names.length)html='<div class="empty"><div class="empty-icon">🖥️</div><div>PC бүртгэгдээгүй байна</div></div>';
  document.getElementById('pcList').innerHTML=html;
  document.getElementById('onlineCount').textContent=onlineCount;
  document.getElementById('totalCount').textContent=names.length;
  document.getElementById('allBtn').disabled=!onlineCount;
  document.getElementById('allMsgBtn').disabled=!onlineCount;
  document.getElementById('allCmdBtn').disabled=!onlineCount;
}

function confirmOne(type,name){confirmAction={type,name,all:false};setupModal(type,name);openModal()}
function confirmAll(type){confirmAction={type,all:true};setupModal(type,'бүх PC');openModal()}

function setupModal(type,target){
  const ta=document.getElementById('modalTextarea');
  const ci=document.getElementById('modalCmdInput');
  const btn=document.getElementById('modalConfirm');
  ta.style.display='none';ci.style.display='none';
  if(type==='shutdown'){
    document.getElementById('modalTitle').textContent=`${target} унтраах уу?`;
    document.getElementById('modalDesc').textContent=`${target}-г force shutdown хийнэ.`;
    btn.textContent='Унтраах';btn.className='modal-confirm danger';
  }else if(type==='message'){
    document.getElementById('modalTitle').textContent='💬 Мессеж илгээх';
    document.getElementById('modalDesc').textContent=`${target}-д "${BANG_NAME}" нэртэй popup гарна:`;
    ta.style.display='';ta.value='';
    btn.textContent='Илгээх';btn.className='modal-confirm yellow';
    setTimeout(()=>ta.focus(),300);
  }else if(type==='cmd'){
    document.getElementById('modalTitle').textContent='⌨️ CMD команд';
    document.getElementById('modalDesc').textContent=`${target}-д CMD цонх нээгдэж команд ажиллана. Цонх нээлттэй үлдэнэ.`;
    ci.style.display='';ci.value='ipconfig';
    btn.textContent='Ажиллуулах';btn.className='modal-confirm blue';
    setTimeout(()=>ci.focus(),300);
  }else if(type==='remove'){
    document.getElementById('modalTitle').textContent=`${target}-г устгах уу?`;
    document.getElementById('modalDesc').textContent=`${target}-г жагсаалтаас устгана.`;
    btn.textContent='Устгах';btn.className='modal-confirm gray';
  }
}

function openModal(){document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}

async function doConfirm(){
  closeModal();
  const a=confirmAction;
  if(!a)return;
  if(a.type==='settings'){resetSettings();return;}
  if(a.type==='shutdown'){a.all?await shutdownAll():await doShutdown(a.name);}
  else if(a.type==='message'){
    const msg=document.getElementById('modalTextarea').value.trim();
    if(!msg){showToast('⚠️ Мессеж хоосон');return;}
    a.all?await sendMsgAll(msg):await sendMsg(a.name,msg);
  }
  else if(a.type==='cmd'){
    const cmd=document.getElementById('modalCmdInput').value.trim();
    if(!cmd){showToast('⚠️ CMD хоосон');return;}
    a.all?await sendCmdAll(cmd):await sendCmd(a.name,cmd);
  }
  else if(a.type==='remove'){await removePC(a.name);}
}

async function doShutdown(name){
  try{await fbPut(`${pcPath(name)}/shutdown`,true);showToast(`⏻ ${name} унтраана`)}
  catch{showToast('⚠️ Алдаа')}
}

async function shutdownAll(){
  const now=Math.floor(Date.now()/1000);
  const online=Object.keys(allPcData).filter(n=>(now-(allPcData[n]?.last_seen||0))<ONLINE_TIMEOUT);
  for(const n of online){try{await fbPut(`${pcPath(n)}/shutdown`,true)}catch{}}
  showToast(`⏻ ${online.length} PC унтраана`);
}

async function sendMsg(name,msg){
  try{
    await fbPut(`${pcPath(name)}/message`,msg);
    await fbPut(`${pcPath(name)}/msg_title`,BANG_NAME);
    showToast(`💬 ${name}-д мессеж илгээгдлээ`);
  }catch{showToast('⚠️ Алдаа')}
}

async function sendMsgAll(msg){
  const now=Math.floor(Date.now()/1000);
  const online=Object.keys(allPcData).filter(n=>(now-(allPcData[n]?.last_seen||0))<ONLINE_TIMEOUT);
  for(const n of online){try{await fbPut(`${pcPath(n)}/message`,msg);await fbPut(`${pcPath(n)}/msg_title`,BANG_NAME)}catch{}}
  showToast(`💬 ${online.length} PC-д мессеж`);
}

async function sendCmd(name,cmd){
  try{await fbPut(`${pcPath(name)}/cmd_visible`,cmd);showToast(`⌨️ ${name}-д CMD`)}
  catch{showToast('⚠️ Алдаа')}
}

async function sendCmdAll(cmd){
  const now=Math.floor(Date.now()/1000);
  const online=Object.keys(allPcData).filter(n=>(now-(allPcData[n]?.last_seen||0))<ONLINE_TIMEOUT);
  for(const n of online){try{await fbPut(`${pcPath(n)}/cmd_visible`,cmd)}catch{}}
  showToast(`⌨️ ${online.length} PC-д CMD`);
}

async function removePC(name){
  const now=Math.floor(Date.now()/1000);
  const isOnline=allPcData[name]&&(now-(allPcData[name]?.last_seen||0))<ONLINE_TIMEOUT;
  try{
    if(isOnline){await fbPut(`${pcPath(name)}/remove`,true);showToast(`🗑️ ${name}-д устгах команд`)}
    else{await fbDelete(pcPath(name));delete allPcData[name];renderPCs();showToast(`🗑️ ${name} устгагдлаа`)}
  }catch{showToast('⚠️ Алдаа')}
}

function timeAgo(s){if(s<60)return s+'с';if(s<3600)return Math.floor(s/60)+'м';return Math.floor(s/3600)+'ц'}

let toastTimer;
function showToast(m){
  const el=document.getElementById('toast');
  el.textContent=m;el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2500);
}

document.getElementById('modal').addEventListener('click',e=>{
  if(e.target===document.getElementById('modal'))closeModal();
});

init();
</script>
</body>
</html>
