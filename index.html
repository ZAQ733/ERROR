<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PC Bang Control</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #000;
    color: #0f0;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 15px;
    min-height: 100vh;
    padding: 20px;
    line-height: 1.4;
  }

  /* ================= SETUP UI ================= */
  .setup-container {
    max-width: 500px;
    margin: 50px auto;
    padding: 30px;
    border: 1px solid #0f0;
    border-radius: 8px;
    background: #050505;
  }
  .setup-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; text-align: center; }
  .setup-label { font-size: 13px; color: #0aa; margin-bottom: 5px; }
  .setup-input {
    width: 100%;
    background: #000;
    border: 1px solid #0f0;
    color: #0f0;
    padding: 10px;
    margin-bottom: 15px;
    font-family: inherit;
    outline: none;
  }
  .setup-input:focus { border-color: #0ff; }
  .setup-btn {
    width: 100%;
    background: #0f0;
    color: #000;
    border: none;
    padding: 12px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    font-family: inherit;
    margin-top: 10px;
  }
  .setup-btn:hover { background: #0ff; }

  /* ================= TERMINAL UI ================= */
  .terminal-container { display: none; }
  .terminal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #0f0;
    padding-bottom: 10px;
    margin-bottom: 10px;
  }
  .terminal-title { font-size: 16px; font-weight: bold; }
  .reset-btn {
    background: transparent;
    color: #f00;
    border: 1px solid #f00;
    padding: 5px 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
  }
  .reset-btn:hover { background: #f00; color: #000; }

  .terminal-window {
    border: 1px solid #0f0;
    padding: 15px;
    height: 80vh;
    overflow-y: auto;
    background: #000;
  }
  .output { white-space: pre-wrap; word-break: break-all; }
  .prompt-line { display: flex; margin-top: 5px; }
  .prompt { color: #0f0; margin-right: 5px; white-space: nowrap; }
  input.term-input {
    background: transparent;
    border: none;
    color: #0f0;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 15px;
    outline: none;
    flex: 1;
  }
  .error { color: #f00; }
  .info { color: #0ff; }
  .success { color: #0f0; }
  .highlight { color: #ff0; }
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div class="setup-container" id="setupScreen">
  <div class="setup-title">⚙️ ТОХИРГОО</div>
  <div class="setup-label">Firebase URL</div>
  <input class="setup-input" type="text" id="urlInput" placeholder="https://...">
  <div class="setup-label">Secret Key</div>
  <input class="setup-input" type="password" id="keyInput" placeholder="...">
  <button class="setup-btn" onclick="saveSetup()">ХОЛБОГДОХ</button>
</div>

<!-- MAIN TERMINAL SCREEN -->
<div class="terminal-container" id="terminalScreen">
  <div class="terminal-header">
    <div class="terminal-title" id="termTitle">PC Bang Control - Terminal</div>
    <button class="reset-btn" onclick="resetSettings()">RESET (LOGOUT)</button>
  </div>
  <div class="terminal-window" id="terminalWindow" onclick="focusInput()">
    <div class="output" id="output"></div>
    <div class="prompt-line">
      <span class="prompt" id="promptText">C:\&gt;</span>
      <input type="text" class="term-input" id="cmdInput" autocomplete="off" spellcheck="false">
    </div>
  </div>
</div>

<script>
// ==================== GLOBAL VARIABLES ====================
let FIREBASE_URL = '';
let SECRET_KEY = '';
let BANG_NAME = 'PC Bang';

let allPcData = {};
let currentMenu = 'main';
let selectedPc = null;

// ==================== UI FUNCTIONS ====================
function focusInput() { document.getElementById('cmdInput').focus(); }

function print(text, className = '') {
    const div = document.createElement('div');
    if (className) div.className = className;
    div.textContent = text;
    document.getElementById('output').appendChild(div);
    const term = document.getElementById('terminalWindow');
    term.scrollTop = term.scrollHeight;
}

function clearTerminal() { document.getElementById('output').innerHTML = ''; }

function showSetup() {
    document.getElementById('setupScreen').style.display = 'block';
    document.getElementById('terminalScreen').style.display = 'none';
}

function showTerminal() {
    document.getElementById('setupScreen').style.display = 'none';
    document.getElementById('terminalScreen').style.display = 'block';
    startTerminal();
}

// ==================== INIT & STORAGE ====================
function init() {
    const savedUrl = localStorage.getItem('pcbang_url');
    const savedKey = localStorage.getItem('pcbang_key');
    const savedName = localStorage.getItem('pcbang_name');

    if (savedUrl && savedKey) {
        FIREBASE_URL = savedUrl;
        SECRET_KEY = savedKey;
        BANG_NAME = savedName || 'PC Bang';
        showTerminal();
    } else {
        showSetup();
    }
}

function saveSetup() {
    const url = document.getElementById('urlInput').value.trim().replace(/\/$/, '');
    const key = document.getElementById('keyInput').value.trim();

    if (!url.startsWith('https://')) { alert('URL буруу байна!'); return; }
    if (!key) { alert('Secret Key хоосон байна!'); return; }

    localStorage.setItem('pcbang_url', url);
    localStorage.setItem('pcbang_key', key);
    localStorage.setItem('pcbang_name', 'Insane PC Bang'); // Эсвэл гараар оруулж болно

    FIREBASE_URL = url;
    SECRET_KEY = key;
    BANG_NAME = 'Insane PC Bang';

    showTerminal();
}

function resetSettings() {
    if (!confirm('Та тохиргоог устгаж, дахин нэвтрэхдээ итгэлтэй байна уу?')) return;
    localStorage.removeItem('pcbang_url');
    localStorage.removeItem('pcbang_key');
    localStorage.removeItem('pcbang_name');
    location.reload();
}

// ==================== FIREBASE ====================
async function fbGet(path) {
    try {
        const r = await fetch(`${FIREBASE_URL}/${path}.json`);
        return r.ok ? await r.json() : null;
    } catch { return null; }
}

async function fbPut(path, value) {
    try {
        await fetch(`${FIREBASE_URL}/${path}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(value)
        });
        return true;
    } catch { return false; }
}

async function fbDelete(path) {
    try {
        await fetch(`${FIREBASE_URL}/${path}.json`, { method: 'DELETE' });
        return true;
    } catch { return false; }
}

function pcPath(name) { return `pcs/${SECRET_KEY}/${name}`; }
function pcsPath() { return `pcs/${SECRET_KEY}`; }

// ==================== TERMINAL LOGIC ====================
async function startTerminal() {
    clearTerminal();
    document.getElementById('termTitle').textContent = `${BANG_NAME} - Terminal`;
    print('==========================================', 'info');
    print('     PC BANG TERMINAL v1.0 (Web)', 'info');
    print('==========================================', 'info');
    print(`Connected to: ${BANG_NAME}`, 'success');
    print('');
    showMainMenu();
    focusInput();
}

async function loadPCs() {
    const data = await fbGet(pcsPath());
    allPcData = (data && typeof data === 'object') ? data : {};
}

async function showMainMenu() {
    currentMenu = 'main';
    document.getElementById('promptText').textContent = 'C:\\>';
    clearTerminal();
    print(`=== ${BANG_NAME} CONTROL ===`, 'info');
    print('');
    
    await loadPCs();
    const now = Math.floor(Date.now() / 1000);
    const names = Object.keys(allPcData).filter(n => allPcData[n] && typeof allPcData[n] === 'object').sort();
    
    if (names.length === 0) {
        print("No PCs registered.", 'error');
    } else {
        names.forEach((name, index) => {
            const d = allPcData[name];
            const isOnline = (now - (d.last_seen || 0)) < 15;
            const status = isOnline ? 'ONLINE' : 'OFFLINE';
            const color = isOnline ? 'success' : 'error';
            print(`[${index + 1}] ${name.padEnd(20)} - ${status}`, color);
        });
    }
    print('');
    print("Type PC number, 'rename', or 'exit'.", 'highlight');
}

function showPcMenu(pcName) {
    currentMenu = 'pc_action';
    selectedPc = pcName;
    document.getElementById('promptText').textContent = `[${pcName}]>`;
    clearTerminal();
    print(`=== ${pcName} CONTROL ===`, 'info');
    print('');
    print('[1] Shutdown', 'highlight');
    print('[2] Send CMD Command', 'highlight');
    print('[3] Send Message', 'highlight');
    print('[4] Remove PC', 'highlight');
    print('[5] View Screen', 'highlight');
    print('[0] Back', 'highlight');
    print('');
    print('Select action (0-5):', 'highlight');
}

async function doShutdown(pcName) {
    await fbPut(`${pcPath(pcName)}/shutdown`, true);
    print(`[+] Shutdown command sent to ${pcName}.`, 'success');
    setTimeout(() => showPcMenu(pcName), 1500);
}

async function doSendCmd(pcName, cmd) {
    await fbPut(`${pcPath(pcName)}/cmd_visible`, cmd);
    print(`[+] CMD sent to ${pcName}: ${cmd}`, 'success');
    setTimeout(() => showPcMenu(pcName), 1500);
}

async function doSendMsg(pcName, msg) {
    await fbPut(`${pcPath(pcName)}/message`, msg);
    await fbPut(`${pcPath(pcName)}/msg_title`, BANG_NAME);
    print(`[+] Message sent to ${pcName}.`, 'success');
    setTimeout(() => showPcMenu(pcName), 1500);
}

async function doRemove(pcName) {
    await fbPut(`${pcPath(pcName)}/remove`, true);
    print(`[+] Remove command sent to ${pcName}.`, 'success');
    setTimeout(showMainMenu, 1500);
}

async function doViewScreen(pcName) {
    print(`[*] Requesting screen from ${pcName}...`, 'info');
    await fbPut(`${pcPath(pcName)}/screen_request`, { active: true });
    
    let data = null;
    for (let i = 0; i < 10; i++) {
        await new Promise(r => setTimeout(r, 1000));
        print(`    Waiting for image... (${i+1}s)`);
        data = await fbGet(`${pcPath(pcName)}/screen_data`);
        if (data && data.image) break;
    }
    
    if (data && data.image) {
        print(`[+] Image received!`, 'success');
        // Шинэ цонхонд зураг нээх
        const w = window.open('', '_blank');
        w.document.write(`<html><head><title>Screen - ${pcName}</title></head><body style="margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;"><img src="data:image/jpeg;base64,${data.image}" style="max-width:100%;max-height:100%;"></body></html>`);
        await fbDelete(`${pcPath(pcName)}/screen_data`);
    } else {
        print(`[-] No image received within 10 seconds.`, 'error');
    }
    setTimeout(() => showPcMenu(pcName), 2000);
}

async function doRename() {
    clearTerminal();
    document.getElementById('promptText').textContent = 'Rename>';
    currentMenu = 'rename_old';
    print('Enter the current PC name (e.g., DESKTOP-KABUTO):', 'highlight');
}

async function performRename(oldName, newName) {
    print(`[*] Renaming ${oldName} to ${newName}...`, 'info');
    const data = allPcData[oldName];
    if (!data) {
        print(`[-] Error: PC '${oldName}' not found.`, 'error');
        return showMainMenu();
    }
    
    await fbPut(pcPath(newName), data);
    await fbDelete(pcPath(oldName));
    
    print(`[+] Successfully renamed!`, 'success');
    setTimeout(showMainMenu, 1500);
}

// ==================== INPUT HANDLER ====================
document.getElementById('cmdInput').addEventListener('keydown', async (e) => {
    if (e.key !== 'Enter') return;
    const input = document.getElementById('cmdInput').value.trim();
    document.getElementById('cmdInput').value = '';
    if (!input && currentMenu !== 'msg_input' && currentMenu !== 'cmd_input') return;

    print(`${document.getElementById('promptText').textContent} ${input}`);

    if (currentMenu === 'main') {
        if (input.toLowerCase() === 'exit') {
            print('Exiting terminal...', 'info');
            return;
        }
        if (input.toLowerCase() === 'rename') {
            return doRename();
        }
        const num = parseInt(input);
        const names = Object.keys(allPcData).filter(n => allPcData[n] && typeof allPcData[n] === 'object').sort();
        if (isNaN(num) || num < 1 || num > names.length) {
            print('[-] Invalid number. Type "rename" or "exit".', 'error');
            return;
        }
        showPcMenu(names[num - 1]);
        return;
    }

    if (currentMenu === 'rename_old') {
        const oldName = input;
        if (!allPcData[oldName]) {
            print(`[-] PC '${oldName}' not found. Try again.`, 'error');
            return;
        }
        selectedPc = oldName;
        currentMenu = 'rename_new';
        document.getElementById('promptText').textContent = 'New Name>';
        print(`Enter new name for ${oldName}:`, 'highlight');
        return;
    }

    if (currentMenu === 'rename_new') {
        await performRename(selectedPc, input);
        return;
    }

    if (currentMenu === 'pc_action') {
        const choice = input;
        if (choice === '0') return showMainMenu();
        if (choice === '1') return doShutdown(selectedPc);
        if (choice === '2') {
            currentMenu = 'cmd_input';
            document.getElementById('promptText').textContent = `[${selectedPc}] CMD>`;
            print('Enter CMD command (e.g., ipconfig):', 'highlight');
            return;
        }
        if (choice === '3') {
            currentMenu = 'msg_input';
            document.getElementById('promptText').textContent = `[${selectedPc}] MSG>`;
            print('Enter message:', 'highlight');
            return;
        }
        if (choice === '4') return doRemove(selectedPc);
        if (choice === '5') return doViewScreen(selectedPc);
        print('[-] Invalid choice. Select 0-5.', 'error');
        return;
    }

    if (currentMenu === 'cmd_input') {
        await doSendCmd(selectedPc, input);
        return;
    }

    if (currentMenu === 'msg_input') {
        await doSendMsg(selectedPc, input);
        return;
    }
});

// ==================== START ====================
init();
</script>
</body>
</html>
