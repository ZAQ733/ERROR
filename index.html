<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Terminal - PC Control</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background-color: #000;
    color: #00ff41;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 15px;
    min-height: 100vh;
    padding: 20px;
    line-height: 1.5;
    text-shadow: 0 0 2px rgba(0, 255, 65, 0.4);
    overflow: hidden;
  }

  /* ================= MATRIX BACKGROUND ================= */
  #matrix-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    opacity: 0.15;
  }

  ::selection { background: #00ff41; color: #000; }

  /* ================= SETUP UI ================= */
  .setup-container {
    max-width: 450px;
    margin: 10vh auto;
    padding: 30px;
    border: 1px solid #00ff41;
    background: rgba(0, 0, 0, 0.85);
    box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
    position: relative;
    z-index: 10;
  }
  .setup-title { 
    font-size: 20px; 
    font-weight: bold; 
    margin-bottom: 25px; 
    text-align: center; 
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .setup-label { font-size: 12px; color: #00ffff; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
  .setup-input {
    width: 100%;
    background: transparent;
    border: 1px solid #005500;
    color: #00ff41;
    padding: 10px;
    margin-bottom: 20px;
    font-family: inherit;
    outline: none;
    transition: border 0.3s;
  }
  .setup-input:focus { border-color: #00ff41; box-shadow: 0 0 5px rgba(0, 255, 65, 0.5); }
  .setup-btn {
    width: 100%;
    background: #00ff41;
    color: #000;
    border: none;
    padding: 12px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: 0.3s;
  }
  .setup-btn:hover { background: #00ffff; box-shadow: 0 0 10px #00ffff; }

  /* ================= TERMINAL UI ================= */
  .terminal-container { display: none; max-width: 900px; margin: 0 auto; position: relative; z-index: 10; }
  .terminal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #005500;
    padding-bottom: 10px;
    margin-bottom: 15px;
    font-size: 12px;
    color: #008800;
  }
  .term-title { text-transform: uppercase; letter-spacing: 1px; }
  .reset-btn {
    background: transparent;
    color: #ff003c;
    border: 1px solid #ff003c;
    padding: 4px 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    text-transform: uppercase;
    transition: 0.3s;
  }
  .reset-btn:hover { background: #ff003c; color: #000; box-shadow: 0 0 8px #ff003c; }

  .terminal-window {
    border: 1px solid #005500;
    padding: 15px;
    height: 75vh;
    overflow-y: auto;
    background: rgba(0, 0, 0, 0.8);
  }

  /* Scrollbar */
  .terminal-window::-webkit-scrollbar { width: 8px; }
  .terminal-window::-webkit-scrollbar-track { background: #000; }
  .terminal-window::-webkit-scrollbar-thumb { background: #005500; }
  .terminal-window::-webkit-scrollbar-thumb:hover { background: #00ff41; }

  .output { white-space: pre-wrap; word-break: break-all; margin-bottom: 5px; }
  .prompt-line { display: flex; margin-top: 5px; }
  .prompt { color: #00ffff; margin-right: 8px; white-space: nowrap; font-weight: bold; text-decoration: none !important;}
  
  input.term-input {
    background: transparent;
    border: none;
    color: #00ff41;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 15px;
    outline: none;
    flex: 1;
    text-shadow: 0 0 2px rgba(0, 255, 65, 0.4);
  }
  
  /* Text Colors */
  .error { color: #ff003c; text-shadow: 0 0 2px rgba(255, 0, 60, 0.4); }
  .info { color: #00ffff; text-shadow: 0 0 2px rgba(0, 255, 255, 0.4); }
  .success { color: #00ff41; }
  .highlight { color: #ffaa00; text-shadow: 0 0 2px rgba(255, 170, 0, 0.4); text-decoration: none !important;}
  .white { color: #ffffff; }
  
  /* Хөдөлгөөнтэй зураас */
  .animated-line {
    height: 1px;
    background: linear-gradient(90deg, transparent, #00ffff, transparent);
    margin: 10px 0;
    animation: scan 3s linear infinite;
  }
  @keyframes scan {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
</style>
</head>
<body>

<canvas id="matrix-bg"></canvas>

<!-- SETUP SCREEN -->
<div class="setup-container" id="setupScreen">
  <div class="setup-title">> SYSTEM INITIALIZATION_</div>
  <div class="setup-label">Target Database URL</div>
  <input class="setup-input" type="text" id="urlInput" placeholder="https://...">
  <div class="setup-label">Auth Key</div>
  <input class="setup-input" type="password" id="keyInput" placeholder="...">
  <div class="setup-label">Terminal Name</div>
  <input class="setup-input" type="text" id="nameInput" placeholder="e.g. MAIN_NODE">
  <button class="setup-btn" onclick="saveSetup()">Connect</button>
</div>

<!-- MAIN TERMINAL SCREEN -->
<div class="terminal-container" id="terminalScreen">
  <div class="terminal-header">
    <div class="term-title" id="termTitle">Node: ... | Status: CONNECTED</div>
    <button class="reset-btn" onclick="resetSettings()">Terminate Session</button>
  </div>
  <div class="terminal-window" id="terminalWindow" onclick="focusInput()">
    <div class="output" id="output"></div>
    <div class="prompt-line">
      <span class="prompt" id="promptText">root@sys:~#</span>
      <input type="text" class="term-input" id="cmdInput" autocomplete="off" spellcheck="false">
    </div>
  </div>
</div>

<script>
// ==================== MATRIX BACKGROUND ANIMATION ====================
const canvas = document.getElementById('matrix-bg');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレゲゼデベペオォコソトノホモヨョロゴゾドボポヴッン';
const hangul = '가나다라마바사아자차카타파하ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ';
const kanji = '一二三四五六七八九十百千万円年月日火水木金土曜日本語学校';
const mongolian = 'ᠮᠣᠩᠭᠣᠯ ᠬᠡᠯᠡ ᠪᠢᠴᠢᠭ';
const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const nums = '0123456789';
const specialWords = ['ZAQ5K', '12B', 'FUCK SCHOOL', 'YABAYA', 'Made by ZAQ5K'];

function getRandomChar() {
    const rand = Math.random();
    if (rand < 0.1) return specialWords[Math.floor(Math.random() * specialWords.length)];
    if (rand < 0.25) return katakana.charAt(Math.floor(Math.random() * katakana.length));
    if (rand < 0.4) return hangul.charAt(Math.floor(Math.random() * hangul.length));
    if (rand < 0.5) return kanji.charAt(Math.floor(Math.random() * kanji.length));
    if (rand < 0.55) return mongolian.charAt(Math.floor(Math.random() * mongolian.length));
    if (rand < 0.75) return latin.charAt(Math.floor(Math.random() * latin.length));
    return nums.charAt(Math.floor(Math.random() * nums.length));
}

const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = [];
for (let x = 0; x < columns; x++) {
    drops[x] = 1;
}

function drawMatrix() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = '#00ff41';
    ctx.font = fontSize + 'px monospace';
    
    for (let i = 0; i < drops.length; i++) {
        const text = getRandomChar();
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
        }
        drops[i]++;
    }
}

setInterval(drawMatrix, 1000 / 35);

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

// ==================== GLOBAL VARIABLES ====================
let FIREBASE_URL = '';
let SECRET_KEY = '';
let BANG_NAME = 'PC Bang';

let allPcData = {};
let currentMenu = 'main';
let selectedPc = null;

// ==================== UI FUNCTIONS ====================
function focusInput() { document.getElementById('cmdInput').focus(); }

function print(text, className = '') {
    const div = document.createElement('div');
    if (className) div.className = className;
    div.textContent = text;
    document.getElementById('output').appendChild(div);
    const term = document.getElementById('terminalWindow');
    term.scrollTop = term.scrollHeight;
}

function clearTerminal() { document.getElementById('output').innerHTML = ''; }

function showSetup() {
    document.getElementById('setupScreen').style.display = 'block';
    document.getElementById('terminalScreen').style.display = 'none';
}

function showTerminal() {
    document.getElementById('setupScreen').style.display = 'none';
    document.getElementById('terminalScreen').style.display = 'block';
    startTerminal();
}

// ==================== INIT & STORAGE ====================
function init() {
    const savedUrl = localStorage.getItem('pcbang_url');
    const savedKey = localStorage.getItem('pcbang_key');
    const savedName = localStorage.getItem('pcbang_name');

    if (savedUrl && savedKey) {
        FIREBASE_URL = savedUrl;
        SECRET_KEY = savedKey;
        BANG_NAME = savedName || 'PC Bang';
        showTerminal();
    } else {
        showSetup();
    }
}

function saveSetup() {
    const url = document.getElementById('urlInput').value.trim().replace(/\/$/, '');
    const key = document.getElementById('keyInput').value.trim();
    const name = document.getElementById('nameInput').value.trim() || 'Unnamed Node';

    if (!url.startsWith('https://')) { alert('ERROR: Invalid URL format.'); return; }
    if (!key) { alert('ERROR: Auth Key required.'); return; }

    localStorage.setItem('pcbang_url', url);
    localStorage.setItem('pcbang_key', key);
    localStorage.setItem('pcbang_name', name);

    FIREBASE_URL = url;
    SECRET_KEY = key;
    BANG_NAME = name;

    showTerminal();
}

function resetSettings() {
    if (!confirm('Are you sure you want to terminate the session?')) return;
    localStorage.removeItem('pcbang_url');
    localStorage.removeItem('pcbang_key');
    localStorage.removeItem('pcbang_name');
    location.reload();
}

// ==================== FIREBASE ====================
async function fbGet(path) {
    try {
        const r = await fetch(`${FIREBASE_URL}/${path}.json`);
        return r.ok ? await r.json() : null;
    } catch { return null; }
}

async function fbPut(path, value) {
    try {
        await fetch(`${FIREBASE_URL}/${path}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(value)
        });
        return true;
    } catch { return false; }
}

async function fbDelete(path) {
    try {
        await fetch(`${FIREBASE_URL}/${path}.json`, { method: 'DELETE' });
        return true;
    } catch { return false; }
}

function pcPath(name) { return `pcs/${SECRET_KEY}/${name}`; }
function pcsPath() { return `pcs/${SECRET_KEY}`; }

// ==================== TERMINAL LOGIC ====================
async function startTerminal() {
    clearTerminal();
    document.getElementById('termTitle').textContent = `Node: ${BANG_NAME} | Status: CONNECTED`;
    print('==================================================', 'info');
    print('       SECURE TERMINAL INTERFACE v2.0', 'success');
    print('==================================================', 'info');
    print(`> Connection established with: ${BANG_NAME}`, 'white');
    print('> Fetching network nodes...', 'info');
    print('');
    showMainMenu();
    focusInput();
}

async function loadPCs() {
    const data = await fbGet(pcsPath());
    allPcData = (data && typeof data === 'object') ? data : {};
}

async function showMainMenu() {
    currentMenu = 'main';
    document.getElementById('promptText').textContent = 'root@sys:~#';
    clearTerminal();
    print(`[ SYSTEM: ${BANG_NAME} ]`, 'white');
    print('<div class="animated-line"></div>', 'raw');
    
    await loadPCs();
    const now = Math.floor(Date.now() / 1000);
    const names = Object.keys(allPcData).filter(n => allPcData[n] && typeof allPcData[n] === 'object').sort();
    
    if (names.length === 0) {
        print("[!] No active nodes found.", 'error');
    } else {
        names.forEach((name, index) => {
            const d = allPcData[name];
            const isOnline = (now - (d.last_seen || 0)) < 15;
            const status = isOnline ? '[ONLINE]' : '[OFFLINE]';
            const color = isOnline ? 'success' : 'error';
            print(`[${index + 1}] ${name.padEnd(20)} ${status}`, color);
        });
    }
    
    print('<div class="animated-line"></div>', 'raw');
}

function showPcMenu(pcName) {
    currentMenu = 'pc_action';
    selectedPc = pcName;
    document.getElementById('promptText').textContent = `node(${pcName})>`;
    clearTerminal();
    print(`[ CONNECTED TO NODE: ${pcName} ]`, 'white');
    print('<div class="animated-line"></div>', 'raw');
    print('[1] Terminate Power (Shutdown)', 'highlight');
    print('[2] Execute Payload (CMD)', 'highlight');
    print('[3] Transmit Message', 'highlight');
    print('[4] Wipe Node (Remove)', 'highlight');
    print('[5] Visual Feed (View Screen)', 'highlight');
    print('[0] Disconnect Node', 'highlight');
    print('<div class="animated-line"></div>', 'raw');
}

async function doShutdown(pcName) {
    await fbPut(`${pcPath(pcName)}/shutdown`, true);
    print(`[+] Kill signal sent to ${pcName}.`, 'success');
    setTimeout(() => showPcMenu(pcName), 1500);
}

async function doSendCmd(pcName, cmd) {
    await fbPut(`${pcPath(pcName)}/cmd_visible`, cmd);
    print(`[+] Payload executed on ${pcName}: ${cmd}`, 'success');
    setTimeout(() => showPcMenu(pcName), 1500);
}

async function doSendMsg(pcName, msg) {
    await fbPut(`${pcPath(pcName)}/message`, msg);
    await fbPut(`${pcPath(pcName)}/msg_title`, BANG_NAME);
    print(`[+] Message transmitted to ${pcName}.`, 'success');
    setTimeout(() => showPcMenu(pcName), 1500);
}

async function doRemove(pcName) {
    await fbPut(`${pcPath(pcName)}/remove`, true);
    print(`[+] Wipe command sent to ${pcName}.`, 'success');
    setTimeout(showMainMenu, 1500);
}

async function doViewScreen(pcName) {
    print(`[*] Requesting visual feed from ${pcName}...`, 'info');
    await fbPut(`${pcPath(pcName)}/screen_request`, { active: true });
    
    let data = null;
    for (let i = 0; i < 10; i++) {
        await new Promise(r => setTimeout(r, 1000));
        print(`    > Downloading frame... (${i+1}s)`);
        data = await fbGet(`${pcPath(pcName)}/screen_data`);
        if (data && data.image) break;
    }
    
    if (data && data.image) {
        print(`[+] Frame received. Bypassing sandbox...`, 'success');
        const w = window.open('', '_blank');
        w.document.write(`<html><head><title>FEED - ${pcName}</title></head><body style="margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;"><img src="data:image/jpeg;base64,${data.image}" style="max-width:100%;max-height:100%;box-shadow: 0 0 20px rgba(0,255,65,0.3);"></body></html>`);
        await fbDelete(`${pcPath(pcName)}/screen_data`);
    } else {
        print(`[-] Timeout. No frame received.`, 'error');
    }
    setTimeout(() => showPcMenu(pcName), 2000);
}

async function doRename() {
    clearTerminal();
    document.getElementById('promptText').textContent = 'rename>';
    currentMenu = 'rename_old';
    print('Enter current Node ID:', 'highlight');
}

async function performRename(oldName, newName) {
    print(`[*] Reassigning Node ID: ${oldName} -> ${newName}...`, 'info');
    const data = allPcData[oldName];
    if (!data) {
        print(`[-] Error: Node '${oldName}' not found.`, 'error');
        return showMainMenu();
    }
    
    await fbPut(pcPath(newName), data);
    await fbDelete(pcPath(oldName));
    
    print(`[+] Node ID updated successfully!`, 'success');
    setTimeout(showMainMenu, 1500);
}

// ==================== CUSTOM PRINT FOR HTML ====================
const originalPrint = print;
print = function(text, className = '') {
    if (className === 'raw') {
        const div = document.createElement('div');
        div.innerHTML = text;
        document.getElementById('output').appendChild(div);
    } else {
        originalPrint(text, className);
    }
    const term = document.getElementById('terminalWindow');
    term.scrollTop = term.scrollHeight;
}

// ==================== INPUT HANDLER ====================
document.getElementById('cmdInput').addEventListener('keydown', async (e) => {
    if (e.key !== 'Enter') return;
    const input = document.getElementById('cmdInput').value.trim();
    document.getElementById('cmdInput').value = '';
    if (!input && currentMenu !== 'msg_input' && currentMenu !== 'cmd_input') return;

    print(`${document.getElementById('promptText').textContent} ${input}`, 'white');

    if (currentMenu === 'main') {
        if (input.toLowerCase() === 'exit') {
            print('Closing connection...', 'info');
            return;
        }
        if (input.toLowerCase() === 'rename') {
            return doRename();
        }
        const num = parseInt(input);
        const names = Object.keys(allPcData).filter(n => allPcData[n] && typeof allPcData[n] === 'object').sort();
        if (isNaN(num) || num < 1 || num > names.length) {
            print('[-] Invalid Node ID.', 'error');
            return;
        }
        showPcMenu(names[num - 1]);
        return;
    }

    if (currentMenu === 'rename_old') {
        const oldName = input;
        if (!allPcData[oldName]) {
            print(`[-] Node '${oldName}' not found.`, 'error');
            return;
        }
        selectedPc = oldName;
        currentMenu = 'rename_new';
        document.getElementById('promptText').textContent = 'new_id>';
        print(`Enter new Node ID for ${oldName}:`, 'highlight');
        return;
    }

    if (currentMenu === 'rename_new') {
        await performRename(selectedPc, input);
        return;
    }

    if (currentMenu === 'pc_action') {
        const choice = input;
        if (choice === '0') return showMainMenu();
        if (choice === '1') return doShutdown(selectedPc);
        if (choice === '2') {
            currentMenu = 'cmd_input';
            document.getElementById('promptText').textContent = `[${selectedPc}] cmd>`;
            print('Enter payload command:', 'highlight');
            return;
        }
        if (choice === '3') {
            currentMenu = 'msg_input';
            document.getElementById('promptText').textContent = `[${selectedPc}] msg>`;
            print('Enter message:', 'highlight');
            return;
        }
        if (choice === '4') return doRemove(selectedPc);
        if (choice === '5') return doViewScreen(selectedPc);
        print('[-] Invalid command. Select 0-5.', 'error');
        return;
    }

    if (currentMenu === 'cmd_input') {
        await doSendCmd(selectedPc, input);
        return;
    }

    if (currentMenu === 'msg_input') {
        await doSendMsg(selectedPc, input);
        return;
    }
});

// ==================== START ====================
init();
</script>
</body>
</html>
